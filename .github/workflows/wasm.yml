name: WASM

on:
  pull_request:
    paths: [wasm/**, .github/workflows/wasm.yml]
  push:
    branches: [main]
    paths: [wasm/**, .github/workflows/wasm.yml]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rebuild:
    name: rebuild matches wasm/pkg
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - run: npm run build:wasm
      - name: Fail if the rebuild differs from the committed wasm/pkg
        run: |
          if [ -n "$(git status --porcelain -- wasm)" ]; then
            git status --short -- wasm
            echo "::error::wasm/pkg is out of date. Run npm run build:wasm and commit the result."
            exit 1
          fi
