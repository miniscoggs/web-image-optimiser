name: Desktop

# On a desktop-v<version> tag, builds the desktop app's unsigned installers, each on a runner of
# its own OS and architecture so sharp installs the right binaries, runs the end-to-end test
# against each packaged app, and attaches the installers to a draft GitHub release.

on:
  push:
    tags: ["desktop-v*"]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    name: version
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check the tag names the package's version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "desktop-v$version" ]; then
            echo "::error::$TAG doesn't match package.json's version, $version"
            exit 1
          fi

  build:
    name: build (${{ matrix.os }})
    needs: version
    strategy:
      matrix:
        include:
          - os: windows-latest
            platform: --win
            arch: --x64
            app: release/win-unpacked/Web Image Optimiser.exe
          - os: macos-latest
            platform: --mac
            arch: --arm64
            app: release/mac-arm64/Web Image Optimiser.app/Contents/MacOS/Web Image Optimiser
          - os: macos-15-intel
            platform: --mac
            arch: --x64
            app: release/mac/Web Image Optimiser.app/Contents/MacOS/Web Image Optimiser
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run package:desktop -- ${{ matrix.platform }} ${{ matrix.arch }}
      - name: Test the packaged app
        env:
          WIO_DESKTOP_APP: ${{ github.workspace }}/${{ matrix.app }}
        run: npm run test:desktop
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: installer-${{ matrix.os }}
          path: |
            release/*.exe
            release/*.dmg
          if-no-files-found: error

  release:
    name: draft release
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # to create the release
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: installers
          merge-multiple: true
      - name: Create a draft release with the installers
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: >
          gh release create "$TAG" installers/*
          --repo "$GITHUB_REPOSITORY"
          --verify-tag
          --draft
          --title "Web Image Optimiser ${TAG#desktop-v}"
          --notes "Unsigned installers for Windows (x64) and macOS (Apple silicon and Intel)."
