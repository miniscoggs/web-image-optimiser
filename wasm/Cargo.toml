[package]
name = "ssimulacra2-wasm"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
description = "SSIMULACRA 2 scoring for web-image-optimiser, compiled to WebAssembly"
license = "MIT"
repository = "https://github.com/miniscoggs/web-image-optimiser"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
# default rayon feature needs threads, which wasm32 lacks
ssimulacra2 = { version = "0.5.1", default-features = false }
wasm-bindgen = "0.2.129"

[profile.release]
codegen-units = 1
lto = true
